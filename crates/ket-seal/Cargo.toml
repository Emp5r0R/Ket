[package]
name = "ket-seal"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# End-to-end encryption between an app and the node it pinned from an invite,
# so a TLS-terminating front (a CDN or tunnel) sees only ciphertext.
[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek.workspace = true
hkdf = "=0.13.0"
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
rand.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_json.workspace = true
