name: Server image

# Publishes ghcr.io/emp5r0r/ket-control-plane:<version> for amd64 and arm64
# when a release tag is pushed. Servers installed or updated from that release
# pull it instead of compiling on the VPS (packaging/server/cli/image.sh), and
# fall back to a local build when it is missing or does not match.
# Nothing is published from branches or pull requests.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/emp5r0r/ket-control-plane

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require the tag to match the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [[ "${GITHUB_REF_NAME}" == "v$version" ]] \
            || { printf 'Tag %s does not match workspace version %s\n' "$GITHUB_REF_NAME" "$version" >&2; exit 1; }
          latest=$(jq -r '.releases[-1].version' crates/ket-update/releases.json)
          [[ "$latest" == "$version" ]] \
            || { printf 'releases.json ends at %s, not %s\n' "$latest" "$version" >&2; exit 1; }
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: false
          labels: |
            org.opencontainers.image.title=Ket control plane
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-architecture tag
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          [[ ${#sources[@]} == 2 ]] || { printf 'expected 2 platform images, got %s\n' "${#sources[@]}" >&2; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r '.digest')
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
