[package]
name = "invite-capsule"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Canonical, signed invite capsules: one format for every application that adopts a profile"
publish = false

# Self-contained on purpose (no workspace inheritance): other projects use this
# crate as a git dependency, and it may move to its own repository.
[dependencies]
data-encoding = "2.6"
ed25519-dalek = { version = "2.2", default-features = false, features = ["rand_core", "std", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.11"
sha3 = "0.10"
url = "2.5"
zeroize = "1.7"
