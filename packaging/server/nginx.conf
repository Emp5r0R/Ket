worker_processes auto;
user nginx;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

stream {
    map $ssl_preread_server_name $ket_tls_upstream {
        ${KET_XRAY_SNI} ket_reality;
        default ket_https;
    }

    upstream ket_https {
        server 127.0.0.1:8448;
    }

    upstream ket_reality {
        server xray:8444;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
        proxy_pass $ket_tls_upstream;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=30s;
    server_tokens off;
    access_log off;
    error_log /dev/stderr error;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream ket_control {
        server control-plane:8787;
        keepalive 32;
    }

    upstream ket_xhttp {
        server xray:8445;
        keepalive 32;
    }

    # Public HTTPS edge. Only the two client session routes and the exact
    # deployment-secret transport paths reach a Ket service; every other
    # request, and every unauthenticated rejection, gets the same neutral page.
    server {
        listen 127.0.0.1:8448 ssl;
        http2 on;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:KetTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 32k;
        keepalive_timeout 65s;

        # Never mask 403/409/423/429/5xx: enrolled clients need those to decide
        # between expiry, capacity, a paused invite, back-off, and retry.
        error_page 400 401 404 405 411 413 414 415 422 431 494 = @ket_not_found;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Welcome</title></head><body><p>This site is under construction.</p></body></html>\n';
        }

        location / {
            return 404;
        }

        location @ket_not_found {
            default_type text/html;
            return 404 '<!doctype html><html><head><meta charset="utf-8"><title>Not Found</title></head><body><p>Not Found</p></body></html>\n';
        }

        location = /v1/sessions {
            include /etc/nginx/ket/session-proxy.conf;
        }

        location = /v1/sessions/current {
            include /etc/nginx/ket/session-proxy.conf;
        }

        # Session API requests sealed to the node key: one opaque route, so a
        # TLS-terminating front learns nothing about them.
        location = /v1/sealed {
            include /etc/nginx/ket/session-proxy.conf;
        }

        include /tmp/ket-edge/transport-locations.conf;
    }

    # Container-loopback operations listener for the edge health check only.
    server {
        listen 127.0.0.1:8449;

        location = /healthz {
            proxy_pass http://ket_control;
            proxy_http_version 1.1;
        }

        location / {
            return 404;
        }
    }
}
